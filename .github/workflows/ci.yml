name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    name: macOS · Python + Swift
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Install model-free test dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Python unit tests (no API calls)
        run: python -B -m unittest discover -s NotchPilot -p 'test_*.py'
      - name: Typecheck the app and session tests
        run: >-
          swiftc -swift-version 5 -D SESSION_TESTS -parse-as-library -typecheck
          NotchPilot/Sources/*.swift NotchPilot/Tests/SessionTests.swift
          -framework SwiftUI -framework AppKit -framework AVFoundation
          -framework Carbon -framework ApplicationServices -framework Security
          -framework ScreenCaptureKit
      - name: Voice segmentation and audio conversion
        run: |
          mkdir -p NotchPilot/build
          swiftc -swift-version 5 -parse-as-library \
            NotchPilot/Sources/VoiceCore.swift NotchPilot/Sources/SpeechCapture.swift \
            NotchPilot/Tests/VoiceTests.swift -o NotchPilot/build/voice-tests \
            -framework AVFoundation
          NotchPilot/build/voice-tests
